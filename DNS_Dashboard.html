<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Monitor Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: #2c3e50;
        }

        .header {
            background-color: #1a252f;
            color: white;
            text-align: center;
            padding: 10px 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        /* Creates a 2x2 grid that fills the remaining screen height */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
            /* 60px accounts for the 40px header + 20px top/bottom padding */
            height: calc(100vh - 60px); 
            box-sizing: border-box;
        }

        /* Wraps each iframe to give it rounded corners and a shadow */
        .iframe-wrapper {
            background-color: #ecf0f1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Adjusts to a 1x4 vertical stack on mobile screens */
        @media (max-width: 800px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                height: auto;
            }
            .iframe-wrapper {
                height: 400px; /* Fixed height for mobile */
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Global DNS Monitors</h2>
    </div>

    <div class="grid-container">
        <div class="iframe-wrapper">
            <iframe src="http://Trimbletools.com:28002" title="Trimbletools"></iframe>
        </div>
        <div class="iframe-wrapper">
            <iframe src="http://ibss.jcmbsoft.com:28002/" title="JCMBsoft"></iframe>
        </div>
        <div class="iframe-wrapper">
            <iframe src="http://opensource.snm941.com:28002/" title="SNM941"></iframe>
        </div>
        <div class="iframe-wrapper">
            <iframe src="http://104.64.128.73:28002" title="Direct IP"></iframe>
        </div>
    </div>

</body>
</html>
